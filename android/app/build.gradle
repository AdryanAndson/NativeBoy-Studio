// O NativeBoy Studio preenche jogo-android.properties (nome, identificador e versão do app)
plugins { id 'com.android.application' }

def jogo = new Properties()
file('../jogo-android.properties').withReader('UTF-8') { jogo.load(it) }
def abis = jogo.getProperty('abis', 'arm64-v8a,armeabi-v7a,x86_64').split(',').collect { it.trim() }

android {
    namespace 'org.nativeboy.jogo'
    compileSdk 34
    defaultConfig {
        applicationId jogo.getProperty('id')
        minSdk 21
        targetSdk 34
        versionCode jogo.getProperty('versionCode').toInteger()
        versionName jogo.getProperty('versionName')
        resValue 'string', 'app_name', jogo.getProperty('nome')
        ndk { abiFilters(*abis) }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' }
        }
    }
    signingConfigs {
        release {
            // criada pelo GitHub na primeira compilação e guardada no repositório (privado) do jogo:
            // a mesma assinatura em todas as versões permite atualizar o app sem perder o progresso
            storeFile file('../assinatura.jks')
            storePassword jogo.getProperty('senha', 'nativeboy')
            keyAlias 'nativeboy'
            keyPassword jogo.getProperty('senha', 'nativeboy')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
    sourceSets {
        main { assets.srcDirs = ['../jogo/apk_assets'] }
    }
}
