# Compila o APK deste jogo no GitHub (criado pelo NativeBoy Studio).
# A cada envio, o APK assinado sai em "Releases" e em "Actions" (artefato).
name: apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDL 2 (fontes)
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          mv SDL2-2.30.9 SDL2
          mkdir -p app/src/main/java/org/libsdl
          cp -r SDL2/android-project/app/src/main/java/org/libsdl/app app/src/main/java/org/libsdl/
      - name: Assinatura do app (só na primeira vez)
        run: |
          if [ ! -f assinatura.jks ]; then
            keytool -genkeypair -keystore assinatura.jks -alias nativeboy -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass nativeboy -keypass nativeboy -dname "CN=NativeBoy Studio"
            git config user.name "NativeBoy Studio"
            git config user.email "nativeboy@users.noreply.github.com"
            git add assinatura.jks
            git commit -m "Assinatura do app (mantém as atualizações compatíveis)"
            git push
          fi
      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOME=$(grep '^arquivo=' jogo-android.properties | cut -d= -f2-)
          cp app/build/outputs/apk/release/app-release.apk "$NOME.apk"
          TAG="apk-${GITHUB_SHA::7}"
          gh release create "$TAG" "$NOME.apk" --title "$NOME (APK)" --notes "APK gerado pelo NativeBoy Studio a partir do commit ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "*.apk"
