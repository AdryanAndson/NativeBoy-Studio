# Android: converts a test ROM with the Studio, builds the APK with the project template the Studio
# exports (the same steps as android/github/workflows/apk.yml), installs it on an Android emulator,
# touches the screen buttons and takes screenshots.
name: android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      DEPS: ${{ github.workspace }}/deps
    steps:
      - uses: actions/checkout@v4
      - name: Pacotes do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsdl2-dev imagemagick p7zip-full dpkg-dev fonts-dejavu-core
      - name: Dependências fixas
        run: scripts/fetch_deps.sh
      - name: Studio (Linux)
        run: ./build_linux.sh
      - name: Converter o jogo de teste e exportar o projeto Android
        run: |
          S=dist/linux/pkg/opt/nativeboy-studio/NativeBoyStudio
          $S --convert tests/roms/botoes_test.gb --frames 600 --verify 300 --android --projects "$RUNNER_TEMP/p" --games "$RUNNER_TEMP/g"
          PROJ=$(ls -d "$RUNNER_TEMP"/g/Android/*/ | head -1)
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "PKG=$(grep '^id=' "$PROJ/jogo-android.properties" | cut -d= -f2)" >> "$GITHUB_ENV"
          ls -R "$PROJ" | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar o APK
        run: |
          cd "$PROJ"
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          mv SDL2-2.30.9 SDL2
          mkdir -p app/src/main/java/org/libsdl
          cp -r SDL2/android-project/app/src/main/java/org/libsdl/app app/src/main/java/org/libsdl/
          keytool -genkeypair -keystore assinatura.jks -alias nativeboy -keyalg RSA -keysize 2048 -validity 20000 \
            -storepass nativeboy -keypass nativeboy -dname "CN=NativeBoy Studio"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NativeBoy-teste-botoes.apk"
          ls -la "$GITHUB_WORKSPACE"/*.apk
      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash tests/android_emulador.sh NativeBoy-teste-botoes.apk ${{ env.PKG }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            *.apk
            telas/
